{% extends 'base.html' %}
{% block content %}

<div class="card">
    <div class="card-header">
        <strong>
          {{ jobs.name }} 
        </strong>
    </div>
    <div class="card-body">
  
  
  
  <p class="card-text">
  <strong>Company: </strong>{{ jobs.company }}</p>
  
  <p class="card-text">
  <strong>City: </strong>{{ jobs.city }}</p>

  <p class="card-text">
  <strong>Created At: </strong>{{ jobs.created_at }}</p>
  
  <p class="card-text">
  <strong>ID: </strong>{{ jobs.id }}</p>
      
      
    </div>
  </div>

<a href="{% url 'jobs' %}" class="btn btn-secondary">Back</a>

<a href="{% url 'delete_job' jobs.id %}" class="btn btn-danger">Delete</a>


{% endblock %}
